# Keeps the dependencies current without anybody having to remember.
#
# Monthly and grouped: one pull request a month rather than one per package.
# For a tool that changes on a yearly rhythm that is the right cadence; weekly
# single-package PRs would be noise.
#
# abstractaltitudes uses Renovate instead, but that is not a reason to switch
# here. It moved because Dependabot supports pnpm 7-10 only and silently failed
# on pnpm 12. This is a pip project, which Dependabot handles properly.
#
# One caveat when reviewing these PRs: CI only checks that the dependencies
# install and that every module compiles - and, since test_calculation.py
# exists, that the arithmetic still matches the hand calculations. That last
# part is why a green check here means something.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # The actions themselves go stale too - otherwise actions/checkout and
  # setup-python sit on an old major version for years.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
