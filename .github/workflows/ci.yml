name: CI Workflow

# The job name below ("check") is what a branch ruleset asks for under
# "Require status checks to pass". Renaming the job means updating the rule.
#
# Geprüft wird dreierlei: dass sich die gepinnten Abhängigkeiten auflösen und
# installieren lassen, dass jedes Modul kompiliert, und dass die Rechenkette
# dieselben Zahlen liefert wie von Hand gerechnet (test_berechnung.py).
#
# Der dritte Punkt ist der Grund, warum eine grüne Prüfung an einem Dependabot-PR
# überhaupt etwas aussagt: Die ganze App ist eine Rechenkette über pandas.
# Änderte sich das Verhalten von groupby, idxmin oder str.extract, käme klaglos
# ein falscher Kipppunkt heraus - Installation und Kompilierung blieben davon
# unberührt.
#
# Die Tests brauchen weder Netz noch pytest.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Rechentests (ohne Netz)
        run: python test_berechnung.py
